<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List | Reinss Dev</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main>
        <header>
            <h2>To Do List Basic</h2>
        </header>
        <div class="container">
            <div class="main-content">
                <h2 class="header-todo">Masukkan input tugas yang anda ingin kerjakan hari ini!</h2>
                <hr>
                <input type="text" name="inputTodo" id="inputTodo" class="inputTodo" autocomplete="off">
                <button class="btn-submit" name="btn-submit" id="btn-submit">Submit!</button>
                <p id="alertTodo"></p>
                <div class="list-item" id="list-item">

                </div>
            </div>
        </div>
    </main>
    <script type="module" src="script/function.js"></script>
</body>
</html>
