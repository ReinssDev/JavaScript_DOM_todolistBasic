<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List | Reinss Dev</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main>
        <header>
            <h2>To Do List Basic</h2>
        </header>
        <div class="container">
            <div class="main-content">
                <h2 class="header-todo">Masukkan input tugas yang anda ingin kerjakan hari ini!</h2>
                <hr>
                <form action="" class="form-todo">
                    <label for="inputTodo">Input Tugas :</label>
                    <input type="text" name="inputTodo" id="inputTodo" class="inputTodo" autocomplete="off" required>
                    <label for="inputDate">Tanggal Yang Harus Dikerjakan :</label>
                    <input type="date" name="inputDate" id="inputDate" class="inputDate" required>
                    <button class="btn-submit" name="btn-submit" id="btn-submit">Submit!</button>
                </form>
                <p id="alertTodo"></p>
                <div class="list-item" id="list-item">
                    <h2 class="header-list">Tugas Yang Harus Dikerjakan</h2>
                    <button id="btn-delete"></button>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="script/app.js"></script>
</body>
</html>
